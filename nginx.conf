map $http_x_forwarded_proto $canvas_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $canvas_forwarded_proto $canvas_hsts {
    default "";
    ~*^https$ "max-age=31536000";
}

log_format canvas_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 业务配置最高允许 999MB；网关保留少量 multipart 开销，避免保存出无法生效的上限。
    client_max_body_size 1024m;
    access_log /var/log/nginx/access.log canvas_no_query;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), browsing-topics=()" always;
    add_header Strict-Transport-Security $canvas_hsts always;
    # Blob Worker 与 WASM 用于画布人脸检测和本地合片；任意 HTTPS/HTTP connect 与媒体源用于用户 OSS、签名资源及回环 Canvas Agent。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' data: blob: http: https: ws: wss:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location ^~ /api/public/canvas-shares/ {
        access_log off;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /oauth/linuxdo/callback {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 30s;
    }

    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location ^~ /share/canvas/ {
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
